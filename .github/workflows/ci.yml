name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply fresh schema and verify migration state
        run: |
          alembic upgrade head
          alembic check
      - name: Run API, geospatial, and legacy migration tests
        run: pytest -q

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Test API URL security policy
        run: npm test
      - name: Build
        run: npm run build
      - name: Install private upload service dependencies
        run: npm ci --prefix node_api
      - name: Test private upload authorization and signed-callback boundary
        run: npm test --prefix node_api
