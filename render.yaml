services:
  - type: web
    name: geolabel-backend-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Configure these in the hosting dashboard; this manifest intentionally
    # contains no generated secret and no ephemeral production database.
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEOLABEL_ADMIN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
